<section class="mainSection">
    <form class="boaderLine boaderLineBgColor" [formGroup]="RecepitForm">
        <div class="receiptNumber">
            <div>
                <label class="inputLabel">Receipt No : </label>
                <input type="text" class="form-control" formControlName="ReceiptNumber" style="width: 260px;">
            </div>

            <div>
                <label class="inputLabel">Date : </label>
                <input type="date" class="form-control" formControlName="receiptDate" style="height: 40px;">
            </div>
        </div>

        <div class="receiptFor">
            <div class="m-2">
                <label class="inputLabel">Receipt For : </label>
                <input type="text" class="form-control" formControlName="ReceiptFor">
            </div>

            <div class="m-2">
                <label class="inputLabel">Name : </label>
                <input type="text" class="form-control" formControlName="toPerson" style="width: 260px;">
            </div>

            <div class="m-2" style="width: 40%;">
                <label class="inputLabel">Scheme : </label>
                <input type="text" class="form-control" formControlName="scheme">
            </div>
        </div>

        <div class="receiptFor">
            <div class="m-2">
                <label class="inputLabel">Block : </label>
                <input type="text" class="form-control" formControlName="block">
            </div>

            <div class="m-2">
                <label class="inputLabel">Floor : </label>
                <input type="text" class="form-control" formControlName="floor">
            </div>

            <div class="m-2">
                <label class="inputLabel">Asset No : </label>
                <input type="text" class="form-control" formControlName="assetNo">
            </div>

            <div class="m-2">
                <label class="inputLabel">Asset Name : </label>
                <input type="text" class="form-control" formControlName="assetNoName">
            </div>
        </div>

        <div class="receiptFor">
            <div class="m-2">
                <label class="inputLabel">Payment Type : </label>
                <input type="text" class="form-control" formControlName="paymentType">
            </div>

            <div class="m-2">
                <label class="inputLabel">Bank : </label>
                <input type="text" class="form-control" formControlName="bank">
            </div>
        </div>

        <div class="mt-4">
            <div formArrayName="receiptArrays">
                <div class="mt-2 boaderLine" *ngFor="let section of receiptPayment.controls; let i = index"
                    [formGroupName]="i">
                    <div class="flat_form">
                        <div class="insideTheForm">
                            <label class="inputLabel">Account Code : </label>
                            <input type="text" class="form-control valid numeric" style="width:600px;"
                                formControlName="accountCode">
                        </div>

                        <div class="insideTheForm ms-5">
                            <label class="inputLabel">Amount : </label>
                            <input type="number" class="form-control valid numeric" style="width:120px;"
                                formControlName="amount">
                        </div>
                        <!-- <div>
                            <svg (click)="addReceiptArray()" *ngIf="i == 0" xmlns="http://www.w3.org/2000/svg"
                                width="25" height="20" fill="currentColor" class="bi bi-plus-circle-fill iconSize"
                                viewBox="0 0 16 16">
                                <path
                                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z" />
                            </svg>

                            <svg (click)="removePayment(i)" *ngIf="i > 0" xmlns="http://www.w3.org/2000/svg" width="25"
                                height="20" fill="currentColor" class="bi bi-x-octagon-fill iconSizeDelete"
                                viewBox="0 0 16 16">
                                <path
                                    d="M11.46.146A.5.5 0 0 0 11.107 0H4.893a.5.5 0 0 0-.353.146L.146 4.54A.5.5 0 0 0 0 4.893v6.214a.5.5 0 0 0 .146.353l4.394 4.394a.5.5 0 0 0 .353.146h6.214a.5.5 0 0 0 .353-.146l4.394-4.394a.5.5 0 0 0 .146-.353V4.893a.5.5 0 0 0-.146-.353zm-6.106 4.5L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 1 1 .708-.708" />
                            </svg>
                        </div> -->
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3 float-end">
            <div class="mx-2 insideTheForm">
                <label class="inputLabel">Amount Total : </label>
                <input type="text" class="form-control" readonly style="width: 260px; background: #caeeb3;"
                    formControlName="totalAmount">
            </div>
        </div>

        <div class="mt-5">
        </div>

        <div>
            <label class="inputLabel">Remarks : </label>
            <textarea rows="3" cols="30" class="form-control" formControlName="receiptRemarks"></textarea>
        </div>

    </form>

    <div class="bottomButton">
        <button class="btn btn-secondary m-2" routerLink="/famodule/home/receipt">Back</button>
    </div>

</section>
