<section class="main-contain">
    <div class="row">
      <div class="col-1"></div>
      <div class="col-2">
        <label for="">DivisionWise</label>
        <select class="form-select">
          <option value="" selected>--Select--</option>
          <option *ngFor="let division of divisions" [value]="division">{{ division }}</option>
        </select>
      </div>
    
      <div class="col-2">
        <label for="">CodeWise</label>
        <select class="form-select">
          <option value="" selected>--Select--</option>
          <option *ngFor="let division of divisions" [value]="division">{{ division }}</option>
        </select>
      </div>
    
      <div class="col-2">
        <label for="">Financial Year</label>
        <select [(ngModel)]="selectedAnnualYear" class="form-select">
          <option value="Select Annual Year" selected>--Select--</option>
          <option *ngFor="let year of annualYears" [value]="year">{{ year }}</option>
        </select>
      </div>
    
      <div class="col-2">
        <label for="fromDate">From Date:</label>
        <input class=" fromDate form-control" type="date" id="fromDate" name="fromDate" [(ngModel)]="fromDate"
          (change)="onDateChange($event)" />
      </div>
    
      <div class="col-2">
        <label for="toDate">To Date:</label>
        <input class="fromDate form-control" type="date" id="toDate" name="toDate" [(ngModel)]="toDate"
          (change)="onDateChange($event)" />
      </div>
    </div><br>
    <table class="table">
      <tr>
        <th class="heading mx-auto" colspan="8">GST FORMAT</th>
      </tr>
      <!-- </thead> -->
    </table>
    
    
    
    
    <section class="main_table">
      <mat-table [dataSource]="dataSource" class="scroll_heading mat-elevation-z8">
        <ng-container matColumnDef="position">
          <mat-header-cell *matHeaderCellDef> <b>S.No</b> </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{element.position}} </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="division">
          <mat-header-cell *matHeaderCellDef> <b>Name of the Division</b> </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{element.division}} </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="accountCode">
          <mat-header-cell *matHeaderCellDef> <b>ACC CODE</b> </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{element.accountCode}} </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="amount">
          <mat-header-cell *matHeaderCellDef> <b>AMOUNT</b> </mat-header-cell>
          <mat-cell *matCellDef="let element" class=""> {{element.amount}} </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="CGST">
          <mat-header-cell *matHeaderCellDef> <b>CGST</b> </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{element.CGST}} </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="SGST">
          <mat-header-cell *matHeaderCellDef> <b>SGST</b> </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{element.SGST}} </mat-cell>
        </ng-container>
    
    
        <ng-container matColumnDef="IGST">
          <mat-header-cell *matHeaderCellDef> <b>IGST</b> </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{element.IGST}} </mat-cell>
        </ng-container>
    
        <ng-container matColumnDef="Total">
          <mat-header-cell *matHeaderCellDef> <b>Total GST</b> </mat-header-cell>
          <mat-cell *matCellDef="let element"> {{element.Total}} </mat-cell>
        </ng-container>
    
    
        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
      </mat-table>
    </section>
    </section>
