<section class="main-content">
    <div class="header-row mb-2">
        <h3 class="sub-heading mx-auto">SCHEDULES</h3>

          <span><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-download"
                  viewBox="0 0 16 16">
                  <path
                      d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z" />
                  <path
                      d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z" />
              </svg></span>Export to Excel</button> -->
    </div>
    <div class="filter-row mb-2">
        <div class="col-3">
            <div class="search-container">
                <div>
                    <input matInput #input (keyup)="filterSearch($event)" type="text" id="search-input"
                        class="search-input" placeholder="Search...">
                    <div class="search-icon">
                        <mat-icon>search</mat-icon>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 ms-5"></div>
        <div>
            <button class="btn btn-light excelBtn me-1" (click)="generateExcel()">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-file-earmark-arrow-down-fill biExcel-btn" viewBox="0 0 16 16">
                        <path
                            d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1m-1 4v3.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 0 1 .708-.708L7.5 11.293V7.5a.5.5 0 0 1 1 0" />
                    </svg></span>Excel</button>
        </div>
        <div>
            <button class="btn btn-light pdfBtn" (click)="generatePdf()">
                <span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-file-earmark-arrow-down-fill biPdf-btn" viewBox="0 0 16 16">
                        <path
                            d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1m-1 4v3.793l1.146-1.147a.5.5 0 0 1 .708.708l-2 2a.5.5 0 0 1-.708 0l-2-2a.5.5 0 0 1 .708-.708L7.5 11.293V7.5a.5.5 0 0 1 1 0" />
                    </svg></span>PDF</button>
        </div>

    </div>

    <section class="form-section-background">
        <div>
            <form [formGroup]="scheduleFormGroup">
                <div class="row">
                    <div class="scheduleNo col-2">
                        <label for="v_SCHEDULE">Schedule No</label>
                        <input class="form-control" type="text" id="v_SCHEDULE" formControlName="v_SCHEDULE" required
                            oninput="this.value=this.value.replace(/[^0-9]/g,'');" maxlength="2" style="width: 80px;" />
                    </div>
                    <div class="col-3">
                        <label for="v_SCHEDULE_NAME">Schedule Name</label>
                        <input class="form-control" type="text" id="v_SCHEDULE_NAME"
                            formControlName="v_SCHEDULE_NAME" />
                    </div>

                    <div class="col-3">
                        <label for="v_UNDER">Category</label>
                        <select class="form-select" id="v_UNDER" formControlName="v_UNDER">
                            <option value="Income">Income</option>
                            <option value="Expenditures">Expenditures</option>
                            <option value="Assets">Assets</option>
                            <option value="Liabilities">Liabilities</option>
                        </select>
                    </div>

                    <div class="col-1"></div>

                    <div class="col-2 mt-3">
                        <!-- <button class="btn btn-primary" routerLink="/famodule/home/schedule-list">Back</button> -->
                        <button class="btn btn-success submitbutton" (click)="postNewSchedule()">Create</button>
                    </div>

                </div>
            </form>
        </div>
    </section>

    <div class="mt-2 scheduleBorder">
        <table mat-table [dataSource]="allScheduleDataSource" matSort class="schemes-table">

            <!-- ID Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="numberCenter thFirst"> S.No. </th>
                <td mat-cell *matCellDef="let Schedule; let i=index"> {{i + 1}} </td>
            </ng-container>

            <!-- Division Column -->
            <ng-container matColumnDef="scheduleName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Schedule name</th>
                <td mat-cell *matCellDef="let Schedule"> {{Schedule.scheduleName}} </td>
            </ng-container>

            <!-- Division Column -->
            <ng-container matColumnDef="scheduleNo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header class="TableHeading"> Schedule No</th>
                <td mat-cell *matCellDef="let Schedule" class="numberCenter"> {{Schedule.scheduleNo}} </td>
            </ng-container>

            <ng-container matColumnDef="under">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Under</th>
                <td mat-cell *matCellDef="let Schedule"> {{Schedule.under}} </td>
            </ng-container>



            <!-- Action Column -->
            <ng-container matColumnDef="ACTION">
                <th mat-header-cell *matHeaderCellDef class="thBottom"> Action </th>
                <td mat-cell *matCellDef="let Schedule" class="p-0">
                    <div class="d-flex">
                        <a style="color: #161F6D; cursor: pointer; "><span class="material-symbols-rounded"
                                (click)="viewSchedule('view',Schedule.id)">visibility</span></a>
                        <a style="color: #161F6D ; cursor: pointer;"><span class="material-symbols-rounded"
                                (click)="editSchedule('edit',Schedule.id)">edit</span></a>
                        <a (click)="openDelete(Schedule.id)" style="color: red;cursor: pointer;"><span
                                class="material-symbols-rounded">delete</span></a>
                    </div>
                </td>
            </ng-container>
            <!-- routerLink="/famodule/home/schedule-list-view" -->


            <tr mat-header-row *matHeaderRowDef="scheduleTableColumns"></tr>
            <tr mat-row *matRowDef="let Schedule; columns: scheduleTableColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No data matching the filter</td>
            </tr>
        </table>
        <!-- <mat-paginator [pageSizeOptions]="[10, 20, 25]" showFirstLastButtons
            aria-label="Select page of periodic elements">
        </mat-paginator> -->
    </div>
</section>
