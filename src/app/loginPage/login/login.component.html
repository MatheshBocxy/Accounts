<section class="grid-container">
    <div class="login-container d-flex border shadow">
        <div class="image-container">
            <img src="../../../assets/assets/images/Accounts loginPage.webp" alt="marketing-img" class="login-image">
        </div>
        <div class="login-form-container d-flex flex-column justify-content-center px-4">
            <img src="../../../assets/assets/images/tnhb_logo.png" alt="tnhb logo" class="logo">
            <h3 class="text-center">Login</h3>
            <form [formGroup]="loginForm" class="d-flex flex-column">
                <mat-form-field appearance="outline">
                    <mat-label>Username</mat-label>
                    <input matInput formControlName="username">
                    <mat-icon matSuffix>account_circle</mat-icon>
                </mat-form-field>
                <mat-form-field appearance="outline">
                    <mat-label>Password</mat-label>
                    <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
                    <button mat-icon-button matSuffix (click)="hide = !hide" [attr.aria-label]="'Hide password'"
                        [attr.aria-pressed]="hide">
                        <mat-icon>{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                </mat-form-field>
                <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid"
                    (click)="logIn()">Submit</button>
            </form>
        </div>
    </div>
</section>
